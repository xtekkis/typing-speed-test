<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing Speed Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">

      <h1 class="title">Typing Speed Test</h1>

      <!-- Stats Bar -->
      <div class="stats-bar">
        <div class="stat">
          <span class="stat-label">WPM</span>
          <span class="stat-value" id="wpm">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">ACC</span>
          <span class="stat-value" id="accuracy">100%</span>
        </div>
        <div class="stat">
          <span class="stat-label">TIME</span>
          <span class="stat-value" id="timer">60</span>
        </div>
      </div>

      <!-- Quote display area -->
      <div class="quote-box" id="quote-box"></div>

      <!-- User Input -->
      <input
        type="text"
        id="input-field"
        class="input-field"
        placeholder="Start typing to begin..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      />

    </div>
    <script src="script.js"></script>
  </body>
</html>
